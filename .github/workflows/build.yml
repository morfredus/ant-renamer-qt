# Compilation automatique sur GitHub : controle a chaque push/PR/tag (Linux + Windows). Les livrables Windows sont des artefacts
# du run (verification, et base d'une future signature) ; les releases restent publiees par les scripts de Codage/scripts, pour
# que SHA256SUMS corresponde aux fichiers publies. Meme code que les scripts locaux : package-win.ps1 et les presets CMake.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (build + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Dependances
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ qt6-base-dev libgl1-mesa-dev
      - name: Compilation
        run: cmake --preset linux && cmake --build --preset linux
      - name: Tests
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    name: Windows (build + livrables)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: MSYS2 (MinGW + Qt 6)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Compilation et livrables
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: powershell -ExecutionPolicy Bypass -File scripts\windows\package-win.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/*.zip
            dist/*-setup.exe
