# Automatic build on GitHub: checked at every push, pull request and tag (Linux + Windows). The Windows files are artifacts
# of the run (a check, and the basis of a future signature); releases are published separately by the maintainer, so that
# SHA256SUMS matches the published files. Same code as the local scripts: package-win.ps1 and the CMake presets.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (build + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ qt6-base-dev libgl1-mesa-dev
      - name: Build
        run: cmake --preset linux && cmake --build --preset linux
      - name: Tests
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: .deb package
        run: scripts/linux/package-deb.sh
      - name: Install the .deb (dependencies resolved by apt)
        run: |
          sudo apt-get install -y ./dist/*.deb
          test -x /usr/bin/antrenamer-qt
          ! ldd /usr/bin/antrenamer-qt | grep 'not found'
          test -f /usr/share/antrenamer-qt/Languages/English.lng
      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: dist/*.deb

  windows:
    name: Windows (build + packages)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: MSYS2 (MinGW + Qt 6)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build and packages
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: powershell -ExecutionPolicy Bypass -File scripts\windows\package-win.ps1
      # Engine only: the interface test (panel) opens Qt windows and hangs on the Windows runner (no "offscreen" plugin
      # deployed next to the program, so Qt waits for a dialog box). It runs on Linux.
      - name: Tests (engine)
        shell: msys2 {0}
        timeout-minutes: 5
        run: ctest --test-dir build-mingw -R core --output-on-failure
      - uses: actions/upload-artifact@v7
        with:
          name: windows-dist
          path: |
            dist/*.zip
            dist/*-setup.exe
