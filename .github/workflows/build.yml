# CI: build and test on every push, pull request and tag (Linux + Windows). Windows files are run artifacts only; releases
# are published separately so that SHA256SUMS matches the published files. Same code as package-win.ps1 and the CMake presets.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (build + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ qt6-base-dev libgl1-mesa-dev clang-tidy
      - name: Build
        run: cmake --preset linux -DANTREN_WERROR=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON && cmake --build --preset linux
      - name: clang-tidy (rules in .clang-tidy)
        run: clang-tidy -p build --quiet --warnings-as-errors='*' core/*.cpp app/*.cpp
      - name: Tests
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: .deb package
        run: scripts/linux/package-deb.sh
      - name: Install the .deb (dependencies resolved by apt)
        run: |
          sudo apt-get install -y ./dist/*.deb
          test -x /usr/bin/antrenamer-qt
          ! ldd /usr/bin/antrenamer-qt | grep 'not found'
          test -f /usr/share/antrenamer-qt/Languages/English.lng
      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: dist/*.deb

  appimage:
    # Oldest Ubuntu LTS runner: an AppImage uses the glibc of the machine that runs it. Qt 6.5 comes from install-qt-action
    # because Ubuntu 22.04 ships Qt 6.2 and the project needs 6.4.
    name: Linux (AppImage, glibc 2.35)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++-12 libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libfuse2 zsync
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.5.3
      - name: Build
        run: cmake --preset linux -DCMAKE_CXX_COMPILER=g++-12 && cmake --build --preset linux
      - name: AppImage
        run: scripts/linux/package-appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync

  windows:
    name: Windows (build + packages)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: MSYS2 (MinGW + Qt 6)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build and packages
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: powershell -ExecutionPolicy Bypass -File scripts\windows\package-win.ps1
      # Engine only: the panel test opens Qt windows and hangs on the Windows runner (no "offscreen" plugin). It runs on Linux.
      - name: Tests (engine)
        shell: msys2 {0}
        timeout-minutes: 5
        run: ctest --test-dir build-mingw -R core --output-on-failure
      - uses: actions/upload-artifact@v7
        with:
          name: windows-dist
          path: |
            dist/*.zip
            dist/*-setup.exe
