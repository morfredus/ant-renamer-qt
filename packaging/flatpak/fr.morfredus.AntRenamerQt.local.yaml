# Same as fr.morfredus.AntRenamerQt.yaml, but built from this working copy instead of a Git tag: to try the
# Flatpak before a version is tagged (not for Flathub). From the repository root, on Linux:
#   flatpak-builder --user --install --force-clean build-dir packaging/flatpak/fr.morfredus.AntRenamerQt.local.yaml
#   flatpak run fr.morfredus.AntRenamerQt
app-id: fr.morfredus.AntRenamerQt
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: antrenamer-qt

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # A renamer works on the files of the user: it needs them all (no network: the update check is off under Flatpak).
  - --filesystem=host

modules:
  - name: antrenamer-qt
    buildsystem: simple
    build-commands:
      - cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - cmake --build build --target antrenamer-qt
      - install -Dm755 build/app/antrenamer-qt /app/bin/antrenamer-qt
      # Languages and help are read from ../share/antrenamer-qt next to the binary.
      - install -d /app/share/antrenamer-qt
      - cp -r app/Languages app/help /app/share/antrenamer-qt/
      - >-
        sed -e 's/^Icon=.*/Icon=fr.morfredus.AntRenamerQt/'
        scripts/linux/antrenamer-qt.desktop > fr.morfredus.AntRenamerQt.desktop
      - install -Dm644 fr.morfredus.AntRenamerQt.desktop /app/share/applications/fr.morfredus.AntRenamerQt.desktop
      - install -Dm644 packaging/flatpak/fr.morfredus.AntRenamerQt.metainfo.xml /app/share/metainfo/fr.morfredus.AntRenamerQt.metainfo.xml
      - install -Dm644 app/antrenamer-qt.svg /app/share/icons/hicolor/scalable/apps/fr.morfredus.AntRenamerQt.svg
      - install -Dm644 app/antrenamer-qt.png /app/share/icons/hicolor/256x256/apps/fr.morfredus.AntRenamerQt.png
    sources:
      - type: dir
        path: ../..
        skip: [.git, .cache, build, build-mingw, build-arm64, build-arm64-cross, dist]
