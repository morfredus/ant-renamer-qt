app-id: fr.morfredus.AntRenamerQt
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: antrenamer-qt

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: antrenamer-qt
    buildsystem: simple
    build-commands:
      - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app -DANTRENAMER_DESKTOP_ID=fr.morfredus.AntRenamerQt
      - cmake --build build --target antrenamer-qt
      - cmake --install build
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - .flatpak-builder
